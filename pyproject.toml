[project]
name = "p2c"
version = "0.1.0"
description = "Plan2Cleanse implementation"
readme = "README.md"
requires-python = "==3.8.3"
dependencies = [
    "gpy==1.9.9",
    "gym==0.9.1",
    "gym-compete",
    "matplotlib==3.6.0",
    "mujoco-py==0.5.7",
    "numpy==1.22.4",
    "scipy==1.10.1",
    "setuptools>=75.3.2",
    "torch==2.3.0+cu121",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
gym-compete = { git = "https://github.com/openai/multiagent-competition.git", subdirectory = "gym-compete", rev = "b2e081a192429913b7d21a89525901d59c85e7f3" }

[tool.uv]
index-strategy = "unsafe-best-match"
